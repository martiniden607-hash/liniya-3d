<!doctype html>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Линия ПЭТ 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efefef; --surface:#ffffff; --surface-2:#f6f6f6; --text:#111214; --muted:#5a5d61;
  --line:#d2d3d5; --line-strong:#8f9296; --accent:#0a8fae; --accent-weak:rgba(10,143,174,.10);
  --btn:#ffffff; --btn-text:#111214; --btn-on:#111214; --btn-on-text:#ffffff;
  --scene-bg:#e4e5e6; --floor:#d9dadb; --grid1:#b9bbbe; --grid2:#cacbcd;
  --shadow:0 1px 6px rgba(0,0,0,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141516; --surface:#1c1e20; --surface-2:#222426; --text:#ebeced; --muted:#a2a5a9;
    --line:#35383b; --line-strong:#5f6368; --accent:#5ad2ea; --accent-weak:rgba(90,210,234,.13);
    --btn:#1c1e20; --btn-text:#ebeced; --btn-on:#ebeced; --btn-on-text:#111214;
    --scene-bg:#1e2022; --floor:#2a2c2f; --grid1:#45484c; --grid2:#36393c;
    --shadow:0 1px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#141516; --surface:#1c1e20; --surface-2:#222426; --text:#ebeced; --muted:#a2a5a9;
  --line:#35383b; --line-strong:#5f6368; --accent:#5ad2ea; --accent-weak:rgba(90,210,234,.13);
  --btn:#1c1e20; --btn-text:#ebeced; --btn-on:#ebeced; --btn-on-text:#111214;
  --scene-bg:#1e2022; --floor:#2a2c2f; --grid1:#45484c; --grid2:#36393c;
  --shadow:0 1px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-text-size-adjust:100%}
button{font-family:inherit}
.app{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 24px;max-width:100%}
.top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{font-weight:400;color:var(--muted)}
.mtabs{display:flex;border:1px solid var(--line-strong);border-radius:4px;overflow:hidden;flex:1 1 300px;max-width:560px;min-width:0}
.mtabs button{flex:1 1 0;min-width:0;border:0;border-right:1px solid var(--line-strong);background:var(--btn);color:var(--btn-text);font-size:13px;font-weight:600;padding-block:7px;padding-inline:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtabs button:last-child{border-right:0}
.mtabs button[aria-selected="true"]{background:var(--btn-on);color:var(--btn-on-text)}
.mtabs .s{display:none}
.layout{display:block;margin-top:10px}
.stage{position:relative;height:60vh;height:60svh;min-height:300px;background:var(--scene-bg);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.tools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:6px;flex-wrap:wrap;z-index:5;pointer-events:none}
.tools button{pointer-events:auto;font-size:12px;font-weight:600;padding-block:6px;padding-inline:10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--btn);color:var(--btn-text);cursor:pointer;box-shadow:var(--shadow)}
.tools button[aria-pressed="true"]{background:var(--btn-on);color:var(--btn-on-text);border-color:var(--btn-on)}
.labels{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:12px;font-weight:600;line-height:1;color:#fff;text-shadow:0 0 2px #000,0 0 3px #000,0 0 5px rgba(0,0,0,.85);pointer-events:auto;cursor:pointer;will-change:transform;user-select:none}
.lbl i{position:relative;flex:none;width:12px;height:12px;border:1.5px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.75),inset 0 0 0 1px rgba(0,0,0,.55)}
.lbl i::after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px 0 0 -1.5px;background:#fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.lbl.flip{flex-direction:row-reverse}
.lbl.sel{color:#7fe8ff}
.lbl.sel i{border-color:#7fe8ff}
.card{position:absolute;left:8px;bottom:8px;z-index:6;width:min(400px, calc(100% - 16px));max-height:56%;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:4px;padding-block:10px 12px;padding-inline:12px;box-shadow:var(--shadow)}
.card h2{margin:0 28px 4px 0;font-size:15px;line-height:1.3}
.card h2::before{content:"⊙ ";color:var(--accent)}
.card p{margin:0;font-size:13.5px}
.card .rel{margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.card .rel b{color:var(--text);font-weight:600}
.card .rel ul{margin:4px 0 0;padding-left:18px}
.card .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border:1px solid var(--line);border-radius:3px;background:var(--btn);color:var(--btn-text);font-size:16px;line-height:1;cursor:pointer}
.hint{position:absolute;right:8px;bottom:8px;z-index:4;font-size:11px;color:var(--muted);pointer-events:none;text-align:right}
.err{position:absolute;inset:auto 8px 8px 8px;z-index:7;background:var(--surface);border:1px solid var(--line-strong);border-radius:4px;padding-block:8px;padding-inline:10px;font-size:13px}
.panel{margin-top:12px;min-width:0}
.mhead h1{font-size:18px;line-height:1.25;margin:0 0 4px}
.mhead p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.ptabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ptabs button{font-size:12.5px;padding-block:5px;padding-inline:9px;border:1px solid var(--line);border-radius:3px;background:var(--btn);color:var(--btn-text);cursor:pointer}
.ptabs button[aria-selected="true"]{background:var(--btn-on);color:var(--btn-on-text);border-color:var(--btn-on)}
.pbody h3{font-size:14px;margin:14px 0 6px}
.pbody h3:first-child{margin-top:4px}
.pbody .note{color:var(--muted);font-size:13px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-block:7px;padding-inline:32px 4px;border-top:1px solid var(--line);font-size:14px}
ol.steps li:last-child{border-bottom:1px solid var(--line)}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:22px;height:22px;border:1px solid var(--line-strong);border-radius:50%;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
ol.steps li.hp{cursor:pointer}
ol.steps li.hp:hover,ol.steps li.sel{background:var(--accent-weak)}
.go{display:inline-block;margin-left:6px;padding:0 0 0 0;border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.chip{border:1px solid var(--line);border-radius:3px;padding-block:3px;padding-inline:8px;font-size:12.5px;background:var(--btn);color:var(--btn-text);cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent-weak)}
.defect{border:1px solid var(--line);border-radius:4px;padding-block:8px;padding-inline:10px;margin:0 0 8px;background:var(--surface)}
.defect dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;margin:0}
.defect dt{font-size:12px;color:var(--muted);font-weight:600;padding-top:1px}
.defect dd{margin:0;font-size:13.5px;min-width:0}
.defect dd.what{font-weight:600}
.defect.sel{border-color:var(--accent)}
details.q{border-top:1px solid var(--line);padding-block:8px}
details.q:last-child{border-bottom:1px solid var(--line)}
details.q summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;padding-left:24px;position:relative}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:"+";position:absolute;left:0;top:0;width:16px;height:18px;border:1px solid var(--line-strong);border-radius:3px;text-align:center;font-weight:700;line-height:16px;font-size:13px}
details.q[open] summary::before{content:"−"}
details.q .a{margin:6px 0 0 24px;font-size:14px}
@media (max-width:520px){
  .mtabs .l{display:none}
  .mtabs .s{display:inline}
  .hint{display:none}
}
@media (min-width:900px){
  .app{height:100%;display:flex;flex-direction:column;padding-block:0 12px}
  .layout{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:60% minmax(0,40%);gap:0 16px;margin-top:12px}
  .stage{height:auto;min-height:0}
  .panel{margin-top:0;overflow-y:auto;min-height:0;padding-right:4px}
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Линия ПЭТ/ПП <span>· 3D-разбор оборудования</span></div>
    <nav class="mtabs" id="mtabs" role="tablist" aria-label="Оборудование">
      <button role="tab" data-m="line" aria-selected="true" aria-label="Линия листа"><span class="l">Линия листа</span><span class="s">Линия</span></button>
      <button role="tab" data-m="vac" aria-selected="false" aria-label="Вакуумформовка"><span class="l">Вакуумформовка</span><span class="s">Вакуум</span></button>
      <button role="tab" data-m="thermo" aria-selected="false" aria-label="Термоформовка"><span class="l">Термоформовка</span><span class="s">Термо</span></button>
    </nav>
  </header>
  <main class="layout">
    <section class="stage" id="stage" aria-label="3D-модель">
      <div class="tools">
        <button id="bRun" aria-pressed="false">Пуск</button>
        <button id="bCut" aria-pressed="false">Разрез</button>
        <button id="bLbl" aria-pressed="true">Подписи</button>
        <button id="bHome">Общий вид</button>
      </div>
      <div class="labels" id="labels"></div>
      <div class="card" id="card" hidden>
        <button class="x" id="cardX" aria-label="Закрыть">×</button>
        <h2 id="cardT"></h2>
        <p id="cardP"></p>
        <div class="rel" id="cardR" hidden></div>
      </div>
      <div class="hint" id="hint">Крутить — мышь или палец · зум — колесо или щипок · сдвиг — правая кнопка или два пальца</div>
    </section>
    <section class="panel" id="panel">
      <div class="mhead"><h1 id="mTitle"></h1><p id="mShort"></p></div>
      <nav class="ptabs" id="ptabs" role="tablist" aria-label="Разделы"></nav>
      <div class="pbody" id="pbody"></div>
    </section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
window.CONTENT = {
  machines: [
    {
      id: "line",
      title: "Линия листа ПЭТ/ПП",
      short: "Экструзионная линия: из гранул и вторички ПЭТ или ПП делает лист («плёнку») 0,2–1,5 мм и мотает его в рулоны. Из этих рулонов потом формуют тортницы и стаканы.",
      parts: [
        { id: "dryer", name: "Сушилка-кристаллизатор", text: "Сушит ПЭТ перед плавкой: 4–6 часов при 150–170 °C сухим горячим воздухом (точка росы около −40 °C), до влажности не больше 0,005 %. Кристаллизатор не даёт хлопьям слипнуться. Влажный ПЭТ при плавлении разрушается: лист мутный, с пузырями, хрупкий. ПП обычно не сушат. Бывает и без сушилки: двухшнековый экструдер с вакуумной дегазацией — влагу отсасывает вакуум-насос." },
        { id: "loader", name: "Вакуумный загрузчик", text: "Сам подаёт сырьё по трубе в бункер, когда уровень падает." },
        { id: "hopper", name: "Бункер и дозатор", text: "Смешивает сырьё в заданных процентах: первичка, вторичка (флекс — дроблёные бутылки), своя дроблёнка, краситель-мастербатч." },
        { id: "extruder", name: "Экструдер", text: "Мотор с редуктором крутит шнек в толстом цилиндре. Обороты шнека — это сколько килограммов расплава в час." },
        { id: "heaters", name: "Зоны нагрева", text: "5–8 нагревателей-хомутов с вентиляторами. Ориентиры: ПЭТ примерно 260–285 °C, ПП примерно 210–250 °C, а точные цифры — в рецепте линии. У каждой зоны своя термопара (датчик) и своя уставка на пульте." },
        { id: "screw", name: "Шнек", text: "Захватывает гранулы, сжимает и плавит их (нагреватели + трение) и давит расплав вперёд." },
        { id: "screen", name: "Сеткосменщик (фильтр)", text: "Сетки ловят грязь и непроплав. Перед ним датчик давления: давление растёт — сетка забилась, пора менять." },
        { id: "pump", name: "Насос расплава", text: "Шестерёнчатый насос даёт ровную подачу, чтобы толщина листа не «гуляла». Стоит не на всех линиях." },
        { id: "die", name: "Плоская головка", text: "Растекает расплав на всю ширину и выпускает через узкую щель. Болтами губок выравнивают толщину по ширине. У головки свои зоны нагрева." },
        { id: "rolls", name: "Валки (каландр)", text: "Три хромированных валка с водой внутри: калибруют толщину и охлаждают ленту. ПЭТ надо остудить быстро — иначе мутнеет. Поверхность зеркальная: только мягкая ткань, никакого железа." },
        { id: "tcu", name: "Термостаты валков", text: "Гонят воду нужной температуры через валки. Для ПЭТ задача — быстро снять тепло, чтобы лист остался прозрачным (аморфным). Ниже ~100 °C ПЭТ не кристаллизуется, выше начинает белеть. Валки обычно держат в пределах примерно 20–80 °C, а точные цифры — в рецепте линии." },
        { id: "conveyor", name: "Охлаждающий рольганг", text: "Лист дальше остывает на роликах." },
        { id: "gauge", name: "Толщиномер", text: "Ездит поперёк листа и меряет толщину. Если его нет — меряют микрометром в 5–10 точках по ширине." },
        { id: "edge", name: "Обрезка кромки", text: "Дисковые ножи срезают неровные края. Кромка идёт в дробилку." },
        { id: "haul", name: "Тянущие валки", text: "Резиновые валки тянут лист. Тянут быстрее — лист тоньше." },
        { id: "winder", name: "Намотчик", text: "Мотает лист в рулон. Два вала: рулон готов — лист режут и перекидывают на новый вал без остановки. Важно натяжение намотки." },
        { id: "grinder", name: "Дробилка", text: "Мелет кромку и брак в крошку, крошка идёт обратно в бункер. ПЭТ-крошку тоже сушат." },
        { id: "hmi", name: "Пульт", text: "Сенсорная панель: рецепты, температуры зон, обороты шнека, давление расплава, скорости, аварии." }
      ],
      sections: [
        { id: "how", title: "Как работает", items: [
          { text: "ПЭТ сушат и подают в бункер.", part: "dryer" },
          { text: "Шнек плавит сырьё в цилиндре с нагревателями.", part: "screw" },
          { text: "Фильтр задерживает грязь, насос выравнивает подачу.", part: "screen" },
          { text: "Плоская головка делает из расплава широкую ленту.", part: "die" },
          { text: "Холодные валки калибруют толщину и охлаждают ленту — получается лист.", part: "rolls" },
          { text: "Ножи режут кромку, тянущие валки тянут, намотчик мотает рулон.", part: "winder" },
          { text: "Кромка и брак — в дробилку и обратно в бункер.", part: "grinder" }
        ]},
        { id: "start", title: "Запуск", items: [
          { text: "Осмотр: ограждения на месте, в зоне валков нет инструмента и тряпок, аварийные кнопки работают." },
          { text: "Сушилку включают заранее: ПЭТ сушится 4–6 часов. Проверить температуру и точку росы.", part: "dryer" },
          { text: "Включить воду: термостаты валков, охлаждение горловины и редуктора.", part: "tcu" },
          { text: "Включить нагрев всех зон по рецепту: цилиндр, фильтр, насос, головка.", part: "heaters" },
          { text: "Ждать выхода на температуру и ещё 30–60 минут «пропитки», чтобы застывший пластик внутри расплавился. Шнек на холодную НЕ крутить — сломается.", part: "extruder" },
          { text: "Пустить шнек на малых оборотах. Следить за давлением расплава и нагрузкой мотора: резко растут — стоп, где-то холодно или забита сетка.", part: "hmi" },
          { text: "Первый расплав тёмный, с нагаром — сливают в отход, пока не пойдёт чистый.", part: "die" },
          { text: "Заправка: в перчатках завести ленту расплава в зазор валков, свести валки, протянуть лист через рольганг и тянущие валки до намотчика.", part: "rolls" },
          { text: "Плавно поднимать обороты шнека и скорость валков вместе до рабочих.", part: "haul" },
          { text: "Настроить толщину: зазор валков и болты губок. Замерить по ширине в 5–10 точках.", part: "die" },
          { text: "Проверить лист: прозрачный, без пузырей, полос и чёрных точек. Годный — на намотку.", part: "winder" },
          { text: "Записать параметры в журнал.", part: "hmi" }
        ]},
        { id: "setup", title: "Настройка", items: [
          { text: "Температура зон: выше — расплав жиже и давление ниже, но риск пригара и жёлтого оттенка. Ниже — непроплав, растут давление и нагрузка.", part: "heaters" },
          { text: "Обороты шнека — сколько кг в час. Больше оборотов при той же скорости валков — лист толще.", part: "extruder" },
          { text: "Скорость валков и тянущих: быстрее — тоньше. Толщину держат парой «обороты шнека ↔ скорость валков».", part: "haul" },
          { text: "Зазор валков калибрует лист. Перед зазором должен быть ровный небольшой «валик» расплава по всей ширине.", part: "rolls" },
          { text: "Болты губок головки выравнивают толщину по ширине. Крутить понемногу и ждать пару минут.", part: "die" },
          { text: "Температура воды в валках: прозрачность ПЭТ и ровность листа.", part: "tcu" },
          { text: "Натяжение намотки: сильное тянет лист, слабое — рулон рыхлый и «съезжает».", part: "winder" },
          { text: "Состав сырья: доля вторички и дроблёнки, краситель. Больше вторички — больше грязи и риск хрупкости.", part: "hopper" },

    const tl = p < 0.48 ? 0 : p < 0.6 ? smooth((p - 0.48) / 0.12) : p < 0.66 ? 1 : p < 0.8 ? 1 - smooth((p - 0.66) / 0.14) : 0;
    tiltG.rotation.z = -tl * Math.PI / 2;
    cupsG.visible = p >= 0.2 && p < 0.665;
    cupsG.position.y = p < 0.58 ? 0 : smooth((p - 0.58) / 0.085) * 0.62;
    const va = bump(p, 0.15, 0.4);
    airMat.opacity = va * 0.95; airG.visible = va > 0.01;
    airG.children.forEach(a => { a.position.y = 1.3 - ((tt * 0.5) % 0.12); });
  };
  cupsG.visible = false;
  m.home = {dir:[0.25, 0.55, 1], fitW:7.2, fitH:2.6, target:[-0.3, 1.0, 0.2]};
  return m;
}
/* ===================== registry, labels, selection, camera, loop ===================== */
let ray = null, clock = null, curFly = null, selHelper = null, selMats = [], labelEls = {}, stageW = 1, stageH = 1, runT = 0, vTmp = null;
const ANCH = {
  line:{loader:[-4.55,2.72,0], hopper:[-4.3,1.95,0.2], extruder:[-5.2,1.5,0], heaters:[-3.52,1.42,0], screw:[-2.2,1.2,0.13], screen:[-1.4,1.45,0], pump:[-0.92,1.78,0.2], die:[-0.25,1.45,0], rolls:[0.3,1.72,0], tcu:[0.2,0.8,-1.45], conveyor:[2.2,0.82,0.72], gauge:[3.9,1.45,0], edge:[4.5,1.32,0], haul:[5.15,1.5,0], winder:[6.45,1.78,0], grinder:[4.85,1.15,1.75], hmi:[-2.6,1.62,1.35]},
  vac:{unwinder:[-4.6,1.3,0], chains:[-3.2,1.04,0.47], heater_top:[-2.3,1.38,0], heater_bottom:[-2.3,0.66,0.5], mould:[0.45,0.82,0.1], table:[1.15,0.56,0.48], vacuum:[1.35,0.64,1.25], cooling:[0.7,1.72,0.2], cutter:[2.3,2.3,0], stacker:[3.55,1.25,1.05], skeleton:[4.15,0.95,0], hmi:[-1.3,1.62,1.25]},
  thermo:{unwinder:[-3.2,1.25,0], chains:[-2.3,1.08,0.42], heaters:[-1.45,1.42,0], plug:[0.3,1.72,0.4], mould_tilt:[0.3,0.72,0.42], air:[-0.7,1.28,1.15], stacker:[1.7,0.95,0.42], hmi:[-1.3,1.52,1.15]}
};
const INSIDE = {line:['screw'], vac:['mould', 'table'], thermo:['mould_tilt']};
function partBox(g){
  const box = new THREE.Box3(), tmp = new THREE.Box3(), mx = new THREE.Matrix4();
  g.updateMatrixWorld(true);
  g.traverse(o => {
    if (!o.isMesh) return;
    const geo = o.geometry; if (!geo.boundingBox) geo.computeBoundingBox();
    if (o.isInstancedMesh){ for (let i = 0; i < o.count; i++){ o.getMatrixAt(i, mx); mx.premultiply(o.matrixWorld); tmp.copy(geo.boundingBox).applyMatrix4(mx); box.union(tmp); } }
    else { tmp.copy(geo.boundingBox).applyMatrix4(o.matrixWorld); box.union(tmp); }
  });
  return box;
}
function registerMachine(m){
  m.root.updateMatrixWorld(true);
  Object.keys(m.parts).forEach(pid => {
    const g = m.parts[pid], map = new Map(), mats = [];
    g.traverse(o => {
      if (!o.isMesh) return;
      o.userData.partId = pid; o.userData.mid = m.id;
      let mt;
      if (o.userData.casing) mt = o.material.clone();
      else { mt = map.get(o.material); if (!mt){ mt = o.material.clone(); map.set(o.material, mt); } }
      o.material = mt; if (mats.indexOf(mt) < 0) mats.push(mt);
      m.pick.push(o);
    });
    mats.forEach(mt => { if (mt.emissive){ mt.userData.e0 = mt.emissive.clone(); mt.userData.ei0 = mt.emissiveIntensity; } });
    g.userData.mats = mats;
    m.boxes[pid] = partBox(g);
  });
  m.casings = [];
  m.root.traverse(o => { if (o.isMesh && o.userData.casing){ m.casings.push(o); o.userData.op0 = o.material.opacity; o.userData.tr0 = o.material.transparent; } });
}
function anchorOf(mid, pid){
  const a = ANCH[mid] && ANCH[mid][pid], r = MACH[mid].root.position;
  if (a) return new THREE.Vector3(a[0] + r.x, a[1], a[2]);
  const b = MACH[mid].boxes[pid];
  return new THREE.Vector3((b.min.x + b.max.x) / 2, b.max.y + 0.06, (b.min.z + b.max.z) / 2);
}
function buildLabels(){
  const box = $('labels'); box.innerHTML = ''; labelEls = {};
  if (!MACH[S.m]) return;
  partIds(S.m).forEach(pid => {
    if (!MACH[S.m].boxes[pid]) return;
    const el = document.createElement('div'); el.className = 'lbl' + (S.sel === pid ? ' sel' : ''); el.hidden = true;
    el.innerHTML = '<i></i><span></span>'; el.lastChild.textContent = partName(S.m, pid);
    el.addEventListener('click', ev => { ev.stopPropagation(); selectPart(pid, false); });
    box.appendChild(el);
    labelEls[pid] = {el, a:anchorOf(S.m, pid)};
  });
}
function updateLabels(){
  if (!S.labels) return;
  const placed = [], keys = Object.keys(labelEls);
  if (S.sel && labelEls[S.sel]){ keys.splice(keys.indexOf(S.sel), 1); keys.unshift(S.sel); }
  for (const pid of keys){
    const L = labelEls[pid]; vTmp.copy(L.a).project(camera);
    const vis = vTmp.z < 1 && vTmp.x > -1.05 && vTmp.x < 1.05 && vTmp.y > -1.05 && vTmp.y < 1.05;
    if (!vis){ if (!L.el.hidden) L.el.hidden = true; continue; }
    let x = (vTmp.x + 1) / 2 * stageW - 6; const y = (1 - vTmp.y) / 2 * stageH - 6;
    if (!L.w){ L.el.hidden = false; L.w = L.el.offsetWidth || 0; }
    const flip = x + (L.w || 90) > stageW - 4;
    if (flip) x = x - (L.w || 90) + 12;
    if (L.flip !== flip){ L.flip = flip; L.el.classList.toggle('flip', flip); }
    const r = [x - 2, y - 2, x + (L.w || 90) + 2, y + 16];
    const clash = placed.some(q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1]);
    if (clash){ if (!L.el.hidden) L.el.hidden = true; continue; }
    placed.push(r);
    if (L.el.hidden) L.el.hidden = false;
    L.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
  }
}
function isNarrow(){ return window.innerWidth < 900; }
function selectPart(pid, fromList){
  selMats.forEach(mt => { if (mt.userData.e0){ mt.emissive.copy(mt.userData.e0); mt.emissiveIntensity = mt.userData.ei0; } });
  selMats = [];
  if (selHelper){ scene.remove(selHelper); selHelper = null; }
  for (const k in labelEls) labelEls[k].el.classList.remove('sel');
  S.sel = pid && DEF[S.m].names[pid] ? pid : null;
  showCard(S.sel); markPanelSel();
  const m = MACH[S.m];
  if (!S.sel || !m || !scene) return;
  const g = m.parts[S.sel];
  if (!S.cut && INSIDE[S.m] && INSIDE[S.m].indexOf(S.sel) >= 0){ S.cut = true; applyCut(); syncTools(); }
  selMats = g ? g.userData.mats.filter(mt => mt.userData.e0) : [];
  const b = m.boxes[S.sel];
  if (b){
    selHelper = new THREE.Box3Helper(b.clone().expandByScalar(0.03), 0x22d3ee);
    selHelper.material.depthTest = false; selHelper.material.transparent = true; selHelper.material.opacity = 0.9; selHelper.renderOrder = 999;
    scene.add(selHelper); flyToBox(b);
  }
  if (labelEls[S.sel]) labelEls[S.sel].el.classList.add('sel');
  if (fromList && isNarrow()){ const r = $('stage').getBoundingClientRect(); if (r.top < -40 || r.bottom > window.innerHeight + 40) $('stage').scrollIntoView({behavior:reduceMotion ? 'auto' : 'smooth', block:'start'}); }
}
function flyTo(t, p, dur){ curFly = {t:0, dur:reduceMotion ? 0.01 : (dur || 0.9), t0:controls.target.clone(), p0:camera.position.clone(), t1:t.clone(), p1:p.clone()}; }
function flyToBox(b){
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const rad = Math.max(0.3, s.length() / 2);
  const vf = camera.fov * Math.PI / 180, hf = 2 * Math.atan(Math.tan(vf / 2) * camera.aspect);
  const dist = Math.min(Math.max(rad / Math.sin(Math.min(vf, hf) / 2) * 1.6, 1.8), 16);
  const cur = camera.position.clone().sub(controls.target).normalize(), zs = cur.z < -0.2 ? -1 : 1;
  const dir = new THREE.Vector3(cur.x * 0.7, 0.3, zs * Math.max(0.6, Math.abs(cur.z))).normalize();
  const t = c.clone(); if (isNarrow()) t.y -= dist * 0.14;
  flyTo(t, c.clone().addScaledVector(dir, dist));
}
function homeView(mid){
  const m = MACH[mid], h = m.home, rx = m.root.position.x;
  const t = new THREE.Vector3(h.target[0] + rx, h.target[1], h.target[2]);
  const dir = new THREE.Vector3(h.dir[0] + (camera.aspect < 1.1 ? 0.75 : 0), h.dir[1], h.dir[2]).normalize();
  if (!m.fitBox) m.fitBox = partBox(m.root);
  const b = m.fitBox, cs = [];
  for (let i = 0; i < 8; i++) cs.push(new THREE.Vector3(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z));
  const cam = camera.clone(), vf = camera.fov * Math.PI / 180, rt = new THREE.Vector3(), up = new THREE.Vector3();
  let d = 30;
  for (let it = 0; it < 7; it++){
    cam.position.copy(t).addScaledVector(dir, d); cam.lookAt(t); cam.updateMatrixWorld(true);
    let x0 = 9, x1 = -9, y0 = 9, y1 = -9;
    cs.forEach(c => { vTmp.copy(c).project(cam); x0 = Math.min(x0, vTmp.x); x1 = Math.max(x1, vTmp.x); y0 = Math.min(y0, vTmp.y); y1 = Math.max(y1, vTmp.y); });
    const hh = d * Math.tan(vf / 2), hw = hh * cam.aspect;
    rt.setFromMatrixColumn(cam.matrixWorld, 0); up.setFromMatrixColumn(cam.matrixWorld, 1);
    t.addScaledVector(rt, (x0 + x1) / 2 * hw).addScaledVector(up, ((y0 + y1) / 2 + 0.06) * hh);
    d = Math.min(60, Math.max(2, d * Math.max((x1 - x0) / 2, (y1 - y0) / 2, 0.05) / 0.92));
  }
  return {t, p:t.clone().addScaledVector(dir, d)};
}
function flyHome(){ const v = homeView(S.m); flyTo(v.t, v.p, 1.1); }
function setMachine(mid){
  if (!DEF[mid]) return;
  S.m = mid;
  renderHead(); renderBody();
  if (!scene){ showCard(null); return; }
  selectPart(null);
  buildLabels();
  const rx = MACH[mid].root.position.x;
  sun.position.set(rx - 4, 11, 7); sun.target.position.set(rx, 0, 0);
  flyHome();
}
function applyCut(){
  Object.keys(MACH).forEach(k => MACH[k].casings.forEach(o => {
    const mt = o.material;
    if (S.cut){ mt.transparent = true; mt.opacity = o.userData.cutOp || (o.userData.glow ? 0.35 : 0.14); mt.depthWrite = false; }
    else { mt.transparent = o.userData.tr0; mt.opacity = o.userData.op0; mt.depthWrite = true; }
    mt.needsUpdate = true; o.castShadow = !S.cut;
  }));
}
function resize(){
  const st = $('stage'), w = st.clientWidth, h = st.clientHeight;
  if (!w || !h) return;
  stageW = w; stageH = h;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
function bindPick(){
  const cv = renderer.domElement; let down = null;
  cv.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now()}; });
  cv.addEventListener('pointerup', e => {
    if (!down) return;
    const dx = e.clientX - down.x, dy = e.clientY - down.y, ms = performance.now() - down.t; down = null;
    if (dx * dx + dy * dy > 49 || ms > 650) return;
    const r = cv.getBoundingClientRect();
    ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
    let list = [];
    Object.keys(MACH).forEach(k => { list = list.concat(MACH[k].pick); });
    if (S.cut) list = list.filter(o => !o.userData.casing);
    const hit = ray.intersectObjects(list, false)[0];
    if (!hit){ selectPart(null); return; }
    const mid = hit.object.userData.mid, pid = hit.object.userData.partId;
    if (mid !== S.m){ setMachine(mid); }
    selectPart(pid, false);
  });
  controls.addEventListener('start', () => { curFly = null; });
}
function showErr(msg){ const d = document.createElement('div'); d.className = 'err'; d.textContent = msg; $('stage').appendChild(d); }
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), now = clock.elapsedTime;
  if (S.running){ runT += dt; for (const k in MACH) MACH[k].update(dt, runT); }
  if (curFly){ curFly.t += dt; const k = smooth(curFly.t / curFly.dur); controls.target.lerpVectors(curFly.t0, curFly.t1, k); camera.position.lerpVectors(curFly.p0, curFly.p1, k); if (curFly.t >= curFly.dur) curFly = null; }
  if (selMats.length){ const k = 0.4 + 0.35 * Math.sin(now * 5); selMats.forEach(mt => { mt.emissive.copy(mt.userData.e0).lerp(HL, k); mt.emissiveIntensity = Math.max(mt.userData.ei0, 0.9); }); }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
}
function main(){
  bindUI(); syncTools(); renderHead(); renderTabs(); renderBody();
  if (!window.THREE || !THREE.OrbitControls){ showErr('Не загрузилась 3D-библиотека (three.js). Текстовые разделы работают.'); return; }
  try {
    HL = new THREE.Color(0x22d3ee); ray = new THREE.Raycaster(); vTmp = new THREE.Vector3();
    initCore();
    buildLine(); buildVac(); buildThermo();
    Object.keys(MACH).forEach(k => registerMachine(MACH[k]));
    MACH.vac.update(1.6, 0); MACH.vac.update(1.28, 0); MACH.thermo.update(1.7, 0); MACH.line.update(0.01, 0);
    resize();
    if (window.ResizeObserver) new ResizeObserver(resize).observe($('stage')); else window.addEventListener('resize', resize);
    bindPick();
    const v = homeView('line'); camera.position.copy(v.p); controls.target.copy(v.t); controls.update();
    sun.position.set(-4, 11, 7); sun.target.position.set(0, 0, 0);
    buildLabels();
    clock = new THREE.Clock();
    window.chaif3d = {info: () => ({tris: renderer.info.render.triangles, calls: renderer.info.render.calls, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures}),
      view: () => { const m = MACH[S.m], b = m.fitBox, out = []; if (b) for (let i = 0; i < 8; i++){ const v = new THREE.Vector3(i & 1 ? b.max.x : b.min.x, i & 2 ? b.max.y : b.min.y, i & 4 ? b.max.z : b.min.z).project(camera); out.push([+v.x.toFixed(2), +v.y.toFixed(2)]); }
        return {cam: camera.position.toArray().map(x => +x.toFixed(2)), tgt: controls.target.toArray().map(x => +x.toFixed(2)), aspect: +camera.aspect.toFixed(3), box: b && [b.min.toArray(), b.max.toArray()], ndc: out}; }};
    loop();
  } catch(err){ console.error(err); showErr('3D не запустился: ' + (err && err.message || err)); }
}
main();
})();
